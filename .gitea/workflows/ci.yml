name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ gitea.workflow }}-${{ gitea.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    if: gitea.event_name != 'schedule'
    runs-on: ubuntu-26.04
    container:
      image: casjaysdev/go:latest
      options: "--user 0:0"
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            /usr/local/share/go/cache
            /usr/local/share/go/pkg/mod
          key: ${{ runner.os }}-caswhois-go-${{ hashFiles('go.sum') }}
      - run: go vet ./...
      - run: staticcheck ./...

  test:
    name: Test
    if: gitea.event_name != 'schedule'
    runs-on: ubuntu-26.04
    container:
      image: casjaysdev/go:latest
      options: "--user 0:0"
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            /usr/local/share/go/cache
            /usr/local/share/go/pkg/mod
          key: ${{ runner.os }}-caswhois-go-${{ hashFiles('go.sum') }}
      - name: Run tests and enforce coverage
        env:
          REPO_OWNER: ${{ gitea.repository_owner }}
          REPO_NAME: caswhois
        run: |
          mkdir -p "/tmp/${REPO_OWNER}"
          COVDIR=$(mktemp -d "/tmp/${REPO_OWNER}/${REPO_NAME}-XXXXXX")
          chmod 0700 "$COVDIR"
          trap 'rm -rf "$COVDIR"' EXIT
          mkdir -p "$COVDIR/data"
          TMPDIR="$COVDIR" go test -cover ./... -args -test.gocoverdir="$COVDIR/data"
          go tool covdata textfmt -i="$COVDIR/data" -o="$COVDIR/coverage.out"
          PCT=$(go tool cover -func="$COVDIR/coverage.out" | awk '/^total:/ {gsub("%","",$3); print int($3)}')
          [ "$PCT" -ge 60 ] || { echo "coverage $PCT% is below 60%" >&2; exit 1; }
          echo "Coverage: $PCT% (minimum 60%)"

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0
      - name: Set scan range
        run: |
          if [ "${{ gitea.event_name }}" = "pull_request" ]; then
            echo "BASE=${{ gitea.event.pull_request.base.sha }}" >> "$GITEA_ENV"
            echo "HEAD=${{ gitea.event.pull_request.head.sha }}" >> "$GITEA_ENV"
          elif [ "${{ gitea.event_name }}" = "push" ] && [ -n "${{ gitea.event.before }}" ] && [ "${{ gitea.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            echo "BASE=${{ gitea.event.before }}" >> "$GITEA_ENV"
            echo "HEAD=${{ gitea.event.after }}" >> "$GITEA_ENV"
            echo "RESULTS=verified,unknown" >> "$GITEA_ENV"
          else
            # schedule / workflow_dispatch / first push on a ref - scan full history
            echo "BASE=" >> "$GITEA_ENV"
            echo "HEAD=" >> "$GITEA_ENV"
            echo "RESULTS=verified" >> "$GITEA_ENV"
          fi
          if [ "${{ gitea.event_name }}" = "pull_request" ]; then
            echo "RESULTS=verified,unknown" >> "$GITEA_ENV"
          fi
      - name: truffleHog scan
        uses: trufflesecurity/trufflehog@27b0417c16317ca9a472a9a8092acce143b49c55  # v3.95.9
        with:
          base: ${{ env.BASE }}
          head: ${{ env.HEAD }}
          extra_args: --results=${{ env.RESULTS }} --exclude-paths=.github/trufflehog-exclude.txt

  workflow-policy:
    name: Workflow Policy
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Enforce SHA-pinned third-party Actions
        run: |
          set -euo pipefail
          VIOLATIONS=$(grep -rInE '^[[:space:]]*uses:[[:space:]]*[^@]+@[^[:space:]]+' .github/workflows \
            | grep -vE '@[0-9a-f]{40}([[:space:]]|$)' || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "Third-party Actions must be pinned to a full 40-char commit SHA:"
            echo "$VIOLATIONS"
            exit 1
          fi
          echo "All Actions are SHA-pinned."
      - name: Reject committed .env files
        run: |
          set -euo pipefail
          ENV_FILES=$(git ls-files | grep -E '(^|/)\.env([^/]*)$' || true)
          if [ -n "$ENV_FILES" ]; then
            echo "Committed .env file(s) found (forbidden):"
            echo "$ENV_FILES"
            exit 1
          fi
          echo "No committed .env files."

  vuln-scan:
    name: Vulnerability & License Scan
    runs-on: ubuntu-26.04
    container:
      image: casjaysdev/go:latest
      options: "--user 0:0"
    env:
      CGO_ENABLED: "0"
      GOFLAGS: -buildvcs=false
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            /usr/local/share/go/cache
            /usr/local/share/go/pkg/mod
          key: ${{ runner.os }}-caswhois-go-${{ hashFiles('go.sum') }}
      - name: govulncheck
        run: govulncheck ./...
      - name: Reject copyleft licenses
        run: bash scripts/verify-licenses.sh

  build:
    name: Build
    if: gitea.event_name != 'schedule'
    needs: [lint, test]
    runs-on: ubuntu-26.04
    container:
      image: casjaysdev/go:latest
      options: "--user 0:0"
    env:
      CGO_ENABLED: "0"
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
            ext: .exe
          - goos: windows
            goarch: arm64
            ext: .exe
          - goos: freebsd
            goarch: amd64
          - goos: freebsd
            goarch: arm64
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            /usr/local/share/go/cache
            /usr/local/share/go/pkg/mod
          key: ${{ runner.os }}-caswhois-go-${{ matrix.goos }}-${{ matrix.goarch }}-${{ hashFiles('go.sum') }}
      - name: Set build info
        run: |
          PROJECT_NAME=$(awk '$1 == "project_name:" {print $2; exit}' IDEA.md)
          COMMIT_ID=$(printf '%.7s' '${{ github.sha }}')
          BUILD_EPOCH=$(date -u +%s)
          echo "PROJECT_NAME=$PROJECT_NAME" >> "$GITEA_ENV"
          echo "VERSION=$COMMIT_ID" >> "$GITEA_ENV"
          echo "COMMIT_ID=$COMMIT_ID" >> "$GITEA_ENV"
          echo "BUILD_EPOCH=$BUILD_EPOCH" >> "$GITEA_ENV"
          echo "BUILD_DATE=$(date -u -d "@$BUILD_EPOCH" +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITEA_ENV"
          if [ -f site.txt ]; then
            echo "OFFICIAL_SITE=$(cat site.txt)" >> "$GITEA_ENV"
          elif [ -n "${{ secrets.OFFICIAL_SITE }}" ]; then
            echo "OFFICIAL_SITE=${{ secrets.OFFICIAL_SITE }}" >> "$GITEA_ENV"
          else
            echo "OFFICIAL_SITE=" >> "$GITEA_ENV"
          fi
      - name: Build server
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          EXT: ${{ matrix.ext }}
        run: |
          mkdir -p binaries
          LDFLAGS="-s -w -X 'main.Version=${{ env.VERSION }}' -X 'main.CommitID=${{ env.COMMIT_ID }}' -X 'main.BuildEpoch=${{ env.BUILD_EPOCH }}' -X 'main.OfficialSite=${{ env.OFFICIAL_SITE }}'"
          go build -buildvcs=false -trimpath -ldflags "$LDFLAGS" -o "binaries/${{ env.PROJECT_NAME }}-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}" ./src
      - name: Build CLI
        if: hashFiles('src/client/**') != ''
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          EXT: ${{ matrix.ext }}
        run: |
          LDFLAGS="-s -w -X 'main.Version=${{ env.VERSION }}' -X 'main.CommitID=${{ env.COMMIT_ID }}' -X 'main.BuildEpoch=${{ env.BUILD_EPOCH }}' -X 'main.OfficialSite=${{ env.OFFICIAL_SITE }}'"
          go build -buildvcs=false -trimpath -ldflags "$LDFLAGS" -o "binaries/${{ env.PROJECT_NAME }}-cli-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}" ./src/client
      - name: Upload server artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ env.PROJECT_NAME }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: binaries/${{ env.PROJECT_NAME }}-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
          retention-days: 7
      - name: Upload CLI artifact
        if: hashFiles('src/client/**') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ env.PROJECT_NAME }}-cli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: binaries/${{ env.PROJECT_NAME }}-cli-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
          retention-days: 7

  image-scan:
    name: Image Scan
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Check for Dockerfile
        id: dockerfile
        run: echo "present=$(test -f docker/Dockerfile && echo true || echo false)" >> "$GITEA_OUTPUT"
      - name: Build image for scanning
        if: steps.dockerfile.outputs.present == 'true'
        run: docker build -f docker/Dockerfile -t caswhois:ci-scan .
      - name: Check image contract
        if: steps.dockerfile.outputs.present == 'true'
        run: bash tests/docker.sh --image-check caswhois:ci-scan
      - name: Scan image with Trivy
        if: steps.dockerfile.outputs.present == 'true'
        uses: aquasecurity/trivy-action@c07df6fec6fa692e6fd1200d50aaa1fdd66f03c8  # v0.36.0
        with:
          image-ref: caswhois:ci-scan
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
